<!-- shared:header:start -->
<a class="skip-link" href="#page-content">Skip to content</a>
<header class="site-header">
  <div class="site-header__inner">
    <a href="/" class="site-name">Miloš Krunić</a>
    <nav class="site-nav" aria-label="Main navigation">
      <ul>
        <li><a href="/">Work</a></li>
        <li><a href="/about/">About</a></li>
        <li><a href="/contact/" aria-current="page">Contact</a></li>
      </ul>
    </nav>
  </div>
</header>
<!-- shared:header:end -->
<main id="page-content" data-page="contact" tabindex="-1">
<section class="contact-section" aria-labelledby="contact-title">
  <div class="page-inner">
    <h1 class="page-title" id="contact-title">Contact Me</h1>
    <p class="page-intro">Feel free to use this form to get in touch if you'd like to collaborate or discuss a project! Fields marked * are required.</p>
    <form class="contact-form" action="https://formspree.io/f/mpwdkdnp" method="POST">
      <div class="form-group">
  <label for="firstname">First name <span aria-hidden="true">*</span></label>
  <input class="form-element" id="firstname" name="firstname" type="text" autocomplete="given-name" placeholder="John" required pattern=".*\S.*" title="Enter text, not only spaces.">
</div>
      <div class="form-group">
  <label for="lastname">Last name <span aria-hidden="true">*</span></label>
  <input class="form-element" id="lastname" name="lastname" type="text" autocomplete="family-name" placeholder="Doe" required pattern=".*\S.*" title="Enter text, not only spaces.">
</div>
      <div class="form-group">
  <label for="email">Email address <span aria-hidden="true">*</span></label>
  <input class="form-element" id="email" name="email" type="email" autocomplete="email" placeholder="john.doe@example.com" required>
</div>
      <div class="form-group">
  <label for="company">Company</label>
  <input class="form-element" id="company" name="company" type="text" autocomplete="organization" placeholder="Your company name">
</div>
      <div class="form-group full">
        <label for="message">What are you looking for? <span aria-hidden="true">*</span></label>
        <textarea class="form-element" id="message" name="message" required rows="5" placeholder="Describe your project or inquiry"></textarea>
      </div>
      <p class="form-status" role="status" aria-live="polite"></p>
      <div class="submit-group"><button type="submit">Send message</button></div>
    </form>
  </div>
</section>
</main>
<script type="module" src="/router.js"></script>
</body>
</html>
